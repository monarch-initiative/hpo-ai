[mypy]
# Many OBO/bioinformatics dependencies (oaklib, ...) ship no type stubs or
# py.typed marker.  We don't maintain stubs for them, so don't flag their
# untyped imports.
disable_error_code = import-untyped

# Generated by gen-pydantic from the LinkML schema -- do not hand-edit, so we
# do not type-check it (regeneration would revert any fixes anyway).
[mypy-hpo_ai.datamodel.*]
ignore_errors = True

[mypy-oaklib,oaklib.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-pytest.*]
ignore_missing_imports = True

[mypy-typer.*]
ignore_missing_imports = True

