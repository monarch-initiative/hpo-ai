pattern_name: abnormallyDecreasedLevelOfChemicalEntityInBlood
pattern_iri: https://w3id.org/obophenotype/hpo-ai/patterns/abnormallyDecreasedLevelOfChemicalEntityInBlood

description: >-
  Pattern for phenotypes describing decreased concentration of a chemical
  entity in the blood circulation.

classes:
  chemical_entity: CHEBI:24431
  blood: UBERON:0000178
  phenotype: UPHENO:0001001
  decreased_amount: PATO:0001997

relations:
  has_part: BFO:0000051
  inheres_in: RO:0000052
  towards: RO:0000080
  part_of: BFO:0000050

annotationProperties:
  exact_synonym: oio:hasExactSynonym

vars:
  chemical: "'chemical_entity'"

name:
  text: "Decreased circulating %s concentration"
  vars:
    - chemical

def:
  text: "The concentration of %s in the blood circulation is below the lower limit of normal."
  vars:
    - chemical

equivalentTo:
  text: "'phenotype' and ('has part' some ('decreased amount' and ('inheres in' some (%s and ('part of' some 'blood')))))"
  vars:
    - chemical

annotations:
  - annotationProperty: exact_synonym
    text: "Decreased %s level"
    vars:
      - chemical
  - annotationProperty: exact_synonym
    text: "Reduced %s level"
    vars:
      - chemical
  - annotationProperty: exact_synonym
    text: "Decreased %s concentration"
    vars:
      - chemical
  - annotationProperty: exact_synonym
    text: "Reduced %s concentration"
    vars:
      - chemical
  - annotationProperty: exact_synonym
    text: "Decreased %s level in blood"
    vars:
      - chemical
  - annotationProperty: exact_synonym
    text: "Reduced %s level in blood"
    vars:
      - chemical
