pattern_name: abnormallyDecreasedLevelOfChemicalEntityInUrine
pattern_iri: https://w3id.org/obophenotype/hpo-ai/patterns/abnormallyDecreasedLevelOfChemicalEntityInUrine

description: >-
  Pattern for phenotypes describing decreased concentration of a chemical
  entity in the urine.

classes:
  chemical_entity: CHEBI:24431
  urine: UBERON:0001088
  phenotype: UPHENO:0001001
  decreased_amount: PATO:0001997

relations:
  has_part: BFO:0000051
  inheres_in: RO:0000052
  part_of: BFO:0000050

annotationProperties:
  exact_synonym: oio:hasExactSynonym

vars:
  chemical: "'chemical_entity'"

name:
  text: "Decreased urinary %s concentration"
  vars:
    - chemical

def:
  text: "The concentration of %s in the urine is below the lower limit of normal."
  vars:
    - chemical

equivalentTo:
  text: "'phenotype' and ('has part' some ('decreased amount' and ('inheres in' some (%s and ('part of' some 'urine')))))"
  vars:
    - chemical

annotations:
  - annotationProperty: exact_synonym
    text: "Decreased urinary %s level"
    vars:
      - chemical
  - annotationProperty: exact_synonym
    text: "Reduced urinary %s concentration"
    vars:
      - chemical
