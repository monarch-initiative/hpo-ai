[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "hpo_ai"
description = "AI-powered pipeline for harmonising chemical phenotypes in the Human Phenotype Ontology (HPO)"
authors = [
  {name = "Nicolas Matentzoglu", email = "nicolas.matentzoglu@gmail.com"},
]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dynamic = ["version"]

dependencies = [
  "typer >= 0.9.0",
  "linkml-runtime >=1.9.4",
  "oaklib >= 0.6.0",
  "httpx >= 0.27.0",
  "pydantic >= 2.0.0",
  "pyyaml >= 6.0",
  "sssom >= 0.4.0",
  "anthropic >= 0.40.0",
]

[dependency-groups]
dev = [
    "linkml>=1.9.3",
    "mypy>=1.17.1",
    "ruff>=0.4.8",
    "mkdocs-material>=8.2.8",
    "mkdocs-mermaid2-plugin>=1.1.1",
    "jupyter>=1.0.0",
    "mknotebooks>= 0.8.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "types-pyyaml>=6.0.12.20250915",
]

[project.scripts]
hpo-ai = "hpo_ai.cli:main"


# See https://hatch.pypa.io/latest/config/build/#file-selection for how to
# explicitly include files other than default into the build distributions.

[tool.hatch.version]
source = "uv-dynamic-versioning"

# Ref.: https://github.com/ninoseki/uv-dynamic-versioning/
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

# Ref.: https://docs.pytest.org/en/stable/reference/reference.html#configuration-options
# NOTE: pytest is configured in pytest.ini (it takes precedence over this
# section, so keep test config there — not here).
[tool.pytest.ini_options]
testpaths = ["tests"]

# Ref.: https://docs.astral.sh/ruff/
[tool.ruff]
# datamodel is generated by gen-pydantic and carries template imports/idioms
# that are not worth linting -- regeneration would revert any fixes.
extend-exclude = ["src/hpo_ai/datamodel"]

# Ref.: https://github.com/codespell-project/codespell
[tool.codespell]
skip = [
  "LICENSE",
  "pyproject.toml",
  "uv.lock",
  "project/*",
  "src/hpo_ai/datamodel/hpo_ai_pydantic.py",
  "src/hpo_ai/datamodel/hpo_ai.py",
]

# Reminder: words have to be lowercased for the ignore-words-list
ignore-words-list = "linke"
quiet-level = 3

# Ref.: https://github.com/crate-ci/typos (spell checker)
[tool.typos.default.extend-words]
linke = "linke"
[tool.typos.files]
extend-exclude = [
  "LICENSE",
  "uv.lock",
  "pyproject.toml",
  "project/*",
  "src/hpo_ai/datamodel/hpo_ai_pydantic.py",
  "src/hpo_ai/datamodel/hpo_ai.py",
]
