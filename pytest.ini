[pytest]
pythonpath = src .
doctest_optionflags = NORMALIZE_WHITESPACE ELLIPSIS
# Default run is deterministic and offline: exclude tests needing an LLM key,
# external network/ROBOT/ontology dbs, or long end-to-end runs. Run those with
# `just pytest-integration`.
addopts = -m "not llm and not integration and not slow"
markers =
    llm: marks tests as LLM tests
    integration: requires external resources (network, ROBOT, or ontology databases)
    slow: long-running end-to-end test
